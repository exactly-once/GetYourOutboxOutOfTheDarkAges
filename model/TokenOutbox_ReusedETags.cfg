\* Variant: a re-created record starts again at version 0, so ETags can repeat.
\* Expected result: NoDuplicateProcessing is violated (ABA on the record ETag).
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = FALSE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "None"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLeftoverRecords
    NoLeftoverTokens
