\* Extension (OrphanCleanup = "Sweeper"), liveness with smaller bounds.
\* Expected result: no error - every message is processed and the sweeper eventually removes all orphans and rows.
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 1
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "Sweeper"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLostMessages
    NoLeftoverRecords
    NoLeftoverTokens
    NoOrphanTokensAfterSweep

PROPERTIES
    AllProcessed
    OrphansSwept
