\* Sweeper, but step 9 does not turn non-checkpointed initial ids into a row.
\* Expected result: NoOrphanTokensAfterSweep is violated - nothing refers to a late-created initial token.
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "SweeperDropInitialIds"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLostMessages
    NoLeftoverRecords
    NoLeftoverTokens
    NoOrphanTokensAfterSweep
