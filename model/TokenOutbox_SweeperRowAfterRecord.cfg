\* Sweeper, but the checkpointed row is deleted AFTER the record, in a separate step.
\* Expected result: NoLostMessages is violated - the sweeper deletes the live token of a sent message.
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "SweeperRowAfterRecord"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLostMessages
    NoLeftoverRecords
    NoLeftoverTokens
    NoOrphanTokensAfterSweep
