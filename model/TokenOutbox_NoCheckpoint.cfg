\* Variant: no checkpoint - tokens are created anew on every attempt and sent right away.
\* Expected result: NoDuplicateProcessing is violated. ConsistentTokens is left out on purpose,
\* because without a checkpoint it trivially fails first and hides the real consequence.
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = FALSE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "None"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    NoLeftoverRecords
    NoLeftoverTokens
