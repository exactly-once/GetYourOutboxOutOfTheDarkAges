\* Variant: token ids are deterministic (derived from the outgoing message) instead of fresh per attempt.
\* Expected result: NoDuplicateProcessing is violated (a stale sender resurrects a consumed token).
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = FALSE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "None"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLeftoverRecords
    NoLeftoverTokens
