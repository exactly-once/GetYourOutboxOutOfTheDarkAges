\* One handler (no concurrent copies in flight), OrphanCleanup = "None": is the token store empty when idle?
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "None"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLeftoverRecords
    NoLeftoverTokens
    NoOrphanTokens

