\* Variant: the incoming token is verified BEFORE the record is loaded.
\* Expected result: NoDuplicateProcessing is violated (the loaded record is a re-created one).
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = FALSE
    OrphanCleanup    = "None"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLeftoverRecords
    NoLeftoverTokens
