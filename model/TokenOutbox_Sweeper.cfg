\* Extension (OrphanCleanup = "Sweeper"): token-set rows + periodic sweeper with a grace period. Safety.
\* Expected result: no error - in particular no token survives the sweeper.
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "Sweeper"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLostMessages
    NoLeftoverRecords
    NoLeftoverTokens
    NoOrphanTokensAfterSweep
