\* Sweeper that deletes rows right away (no grace period).
\* Expected result: NoOrphanTokensAfterSweep is violated - a late token is created after its row was deleted.
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "SweeperNoGrace"

INVARIANTS
    TypeOK
    NoDuplicateProcessing
    NoGhostMessages
    ConsistentTokens
    NoLostMessages
    NoLeftoverRecords
    NoLeftoverTokens
    NoOrphanTokensAfterSweep
