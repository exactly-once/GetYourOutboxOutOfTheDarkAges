\* Extension (OrphanCleanup = "Register"), two handlers: is the token store empty when idle?
\* Expected result: NoOrphanTokens is violated - a concurrent re-generator creates its token
\* after cleanup ran and then crashes before it can release it (needs concurrency AND a crash).
SPECIFICATION Spec

CONSTANTS
    Handlers         = {1, 2}
    ChainLength      = 3
    MaxFailures      = 2
    MaxDuplicates    = 1
    UseCheckpoint    = TRUE
    FreshTokenIds    = TRUE
    UniqueETags      = TRUE
    LoadBeforeVerify = TRUE
    OrphanCleanup    = "Register"

INVARIANTS
    NoOrphanTokens
